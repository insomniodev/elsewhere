[package]
name = "elsewhere"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "Check the time in other places"
license = "MIT"
repository = "https://github.com/insomniodev/elsewhere"
# Git dependencies keep it off crates.io; releases ship on GitHub.
publish = false

[dependencies]
# gpui has had no crates.io release since 0.2.2; this tracks Zed's main.
gpui = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "27bbbc1cc480a7500cec122f120e796d1fb8500c", features = ["font-kit", "wayland", "x11"] }
jiff = "0.2"
unicode-segmentation = "1"

# Embeds the app icon in the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# The dataset generators are dev tools, kept out of `cargo install`.
[features]
gen = []

[[bin]]
name = "geonames_gen"
required-features = ["gen"]

[[bin]]
name = "land_gen"
required-features = ["gen"]

[[bin]]
name = "zones_gen"
required-features = ["gen"]

# Zed's own [patch] entries for gpui's dependencies; cargo ignores a
# dependency's patches, so they are repeated here.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
