name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libfreetype-dev \
            libfontconfig-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
